# ============================================================
# Model registry for the llama-cpp-server Docker container.
#
# Each section is an open-weight LLM served via
#   ghcr.io/ggml-org/llama.cpp:server-cuda
# Models are mounted inside the container at /models.
#
# NOTE: The bge-m3 section is an embedding model and is excluded
#       from the judge/orchestrator lists automatically.
# ============================================================

[medgemma-27b-it]
model = /models/medgemma-27b-it-Q4_K_M.gguf
mmproj = /models/mmproj-BF16.gguf

[gpt-oss-20b]
model = /models/gpt-oss-20b-F16.gguf

[qwen3-30B-A3B-Thinking]
model = /models/Qwen3-30B-A3B-Thinking-2507-Q4_K_M.gguf

[nemotron-3-nano-30B-A3B]
model = /models/Nemotron-3-Nano-30B-A3B-Q4_K_M.gguf

[bge-m3]
model = /models/bge-m3-FP16.gguf

[baichuan-m2-32b]
model = /models/Baichuan-M2-32B.Q4_K_M.gguf

[huatuoGPT-3-32b]
model = /models/HuatuoGPT-3-32B.Q4_K_M.gguf
