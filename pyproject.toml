[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nsclc-eval"
version = "0.1.0"
description = "Multi-tier LLM-as-a-Judge evaluation framework for NSCLC therapy agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mehrshad Alipoor" }]
keywords = ["LLM-as-a-judge", "medical AI", "NSCLC", "evaluation", "agent"]
dependencies = [
    "openai>=1.30",
    "pydantic>=2.5",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "tqdm>=4.66",
    "configparser>=5.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jupyter"]

[project.scripts]
nsclc-eval = "nsclc_eval.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
